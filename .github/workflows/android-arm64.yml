name: Android ARM64 (touch)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/android-arm64.yml'
      - 'android/**'
      - 'game/**'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the fork and pinned engine
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use Android SDK on the hosted Ubuntu runner
        shell: bash
        run: |
          set -euo pipefail
          echo "Android SDK: ${ANDROID_HOME:-not-set}"
          command -v sdkmanager || find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -name sdkmanager
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"

      - name: Install SDK, NDK and host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Assemble the pinned Sonic 2 REV01 disassembly locally
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y lua5.3
          cd game/s2disasm
          chmod +x build_tools/Linux-x86_64/asl \
                   build_tools/Linux-x86_64/p2bin \
                   build_tools/Linux-x86_64/saxman
          lua5.3 build.lua
          test -s s2built.bin
          cp s2built.bin ../sonic2.bin

      - name: Verify generated build ROM matches the supported Rev A revision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zlib import crc32
          data = Path("game/sonic2.bin").read_bytes()
          actual = crc32(data) & 0xFFFFFFFF
          expected = 0x7B905383
          if actual != expected:
              raise SystemExit(
                  f"Built disassembly does not match Sonic 2 Rev A: "
                  f"{actual:08X} != {expected:08X}; refusing to bake wrong code."
              )
          print("Build ROM matches Sonic 2 (World, Rev A). Not packaged into APK.")
          PY

      - name: Build the Linux host recompilation tool
        shell: bash
        run: |
          set -euo pipefail
          cmake -S segagenesisrecomp/recompiler -B .recompiler-build \
            -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build .recompiler-build --target GenesisRecomp --parallel 2

      - name: Generate Android native Sonic 2 code from the private ROM
        shell: bash
        run: |
          set -euo pipefail
          (
            cd game
            ../.recompiler-build/GenesisRecomp sonic2.bin \
              --game game.toml --output-dir ../android/generated/sonic2
          )
          test -s android/generated/sonic2/sonic2_dispatch.c
          test -s android/generated/sonic2/sonic2_layout.c

      - name: Download Android SDL2 dependencies
        shell: bash
        run: python3 android/tools/setup_deps.py

      - name: Compile debug APK with virtual controls
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Upload installable APK (no ROM)
        uses: actions/upload-artifact@v4
        with:
          name: Sonic2Recomp-Android-ARM64-Touch
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove local temporary assembly output and generated sources
        if: always()
        shell: bash
        run: |
          rm -f game/sonic2.bin game/s2disasm/s2built.bin
          rm -rf android/generated/sonic2
